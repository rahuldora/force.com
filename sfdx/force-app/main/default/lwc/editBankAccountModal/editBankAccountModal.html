<template>

    <lightning-card icon-name="utility:co_insurance" variant="base">
        <div slot="title">
            {record.Name}
        </div>
        <div slot="actions">
        
        </div>
        <div slot="footer">
            
                <lightning-button variant="brand" label="Update" onclick={handleUpdate}></lightning-button>
                &nbsp;
                <lightning-button variant="brand" label="Cancel" onclick={handleCancel}></lightning-button>
            
        </div>
        <div>
            <!-- Card Body  -->
            <lightning-layout multiple-rows>
                <lightning-layout-item size="3"></lightning-layout-item>
                <lightning-layout-item size="2">
                    Name
                </lightning-layout-item>
                <lightning-layout-item size="5">
                    <lightning-input type="text" label="Name" name="name" value={record.Name} required variant="label-hidden"  onchange={changeHandler}></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="2"></lightning-layout-item>
            </lightning-layout>

            <lightning-layout multiple-rows>
                <lightning-layout-item size="3"></lightning-layout-item>
                <lightning-layout-item size="2">
                    Bank Name
                </lightning-layout-item>
                <lightning-layout-item size="5">
                    <lightning-input type="text" label="Name" name="name" value={record.Bank_Account_Name__c} required variant="label-hidden"  onchange={changeHandler}></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="2"></lightning-layout-item>
            </lightning-layout>

            <lightning-layout multiple-rows>
                <lightning-layout-item size="3"></lightning-layout-item>
                <lightning-layout-item size="2">
                    Account Type
                </lightning-layout-item>
                <lightning-layout-item size="5">
                    <lightning-combobox label="Account Type" name="accountType" options={accountTypes} variant="label-hidden" value={record.Account_Type__c}  onchange={changeHandler}></lightning-combobox>    
                </lightning-layout-item>
                <lightning-layout-item size="2"></lightning-layout-item>
            </lightning-layout>

            <lightning-layout multiple-rows>
                <lightning-layout-item size="3"></lightning-layout-item>
                <lightning-layout-item size="2">
                    Balance
                </lightning-layout-item>
                <lightning-layout-item size="5">
                    <lightning-input type="number" label="Balance" name="balance" formatter="currency" step="0.01" value={record.Balance__c} required variant="label-hidden"  onchange={changeHandler}></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="2"></lightning-layout-item>
            </lightning-layout>

            <lightning-layout multiple-rows>
                <lightning-layout-item size="3"></lightning-layout-item>
                <lightning-layout-item size="2">
                    Minimum Balance
                </lightning-layout-item>
                <lightning-layout-item size="5">
                    <lightning-input type="number" label="Minimum Balance" name="minimumBalance" formatter="currency" step="0.01" value={record.Minimum_Balance__c} required variant="label-hidden"  onchange={changeHandler}></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="2"></lightning-layout-item>
            </lightning-layout>

        </div>
    </lightning-card>
    
</template>
