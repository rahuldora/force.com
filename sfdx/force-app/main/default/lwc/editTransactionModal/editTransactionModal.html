<template>
    
    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading" size="small" variant="brand"></lightning-spinner>
    </template>
    <template if:false={isLoading}>

        <div class="container">
            <div class="card">

                <div class="header">Edit Transaction</div>
                
                <div class="grid">
                    <lightning-input label="Transaction Date" variant="label-inline" type="date" name="Transaction_Date__c" value={record.Transaction_Date__c} onchange={handleChange} required></lightning-input>
                    <lightning-input label="Description" variant="label-inline" type="text" name="Description__c" value={record.Description__c} onchange={handleChange} required></lightning-input>
                    <lightning-input label="Amount" variant="label-inline" type="number" name="Amount__c" step="0.01" value={record.Amount__c} onchange={handleChange} required></lightning-input>
                    <lightning-combobox label="Payment Method" variant="label-inline" name="Payment_Method__c" value={record.Payment_Method__c} options={paymentMethodOptions} onchange={handleChange} required></lightning-combobox>
                    <lightning-combobox label="Type" variant="label-inline" name="Transaction_Type__c" value={record.Transaction_Type__c} options={txnTypeOptions} onchange={handleChange} required></lightning-combobox>
                    <lightning-combobox label="Payment Instrument" variant="label-inline" name="Payment_Instrument__c" value={record.Payment_Instrument__c} options={paymentInstrumentOptions} onchange={handleChange} required></lightning-combobox>
                    <lightning-combobox label="Category" variant="label-inline" name="Category__c" value={record.Category__c} options={categoryOptions} onchange={handleChange} required></lightning-combobox>
                    <lightning-combobox label="Payment Instrument Detail" variant="label-inline" name="Payment_Instrument_Detail__c" value={record.Payment_Instrument_Detail__c} options={paymentInstrumentDetailOptions} onchange={handleChange} required></lightning-combobox>
                </div>

                <div class="slds-align_absolute-center">
                    <lightning-button name="update" variant="brand" label="Update" onclick={handleClick}></lightning-button>
                    &nbsp;&nbsp;
                    <lightning-button name="cancel" variant="brand" label="Cancel" onclick={handleClick}></lightning-button>
                </div>

            </div>
        </div>

    </template>

</template>
