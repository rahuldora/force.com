<template>
    
    <lightning-card icon-name="utility:inspector_panelq" variant="base">
        <div slot="title">
            Transaction Record
        </div>
        <!-- <div slot="actions">
        </div> -->
        <div slot="footer">
            
                <lightning-button variant="brand" label="Update" onclick={handleUpdate}></lightning-button>
                &nbsp;
                <lightning-button variant="brand" label="Cancel" onclick={handleCancel}></lightning-button>
            
        </div>
        <div>
            <!-- Card Body  -->
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="large" variant="base"></lightning-spinner>
            </template>
            <lightning-layout multiple-rows>
                <lightning-layout-item size="2"></lightning-layout-item>
                <lightning-layout-item size="3">
                    Transaction Date
                </lightning-layout-item>
                <lightning-layout-item size="5">
                    <lightning-input type="Date" name="Transaction_Date__c" value={record.Transaction_Date__c} required variant="label-hidden" onchange={changeHandler}></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="2"></lightning-layout-item>
            </lightning-layout>
            
            <lightning-layout multiple-rows>
                <lightning-layout-item size="2"></lightning-layout-item>
                <lightning-layout-item size="3">
                    Amount
                </lightning-layout-item>
                <lightning-layout-item size="5">
                    <lightning-input type="number" name="Amount__c" formatter="currency" step="0.01" value={record.Amount__c} required variant="label-hidden"  onchange={changeHandler}></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="2"></lightning-layout-item>
            </lightning-layout>
            
            <lightning-layout multiple-rows>
                <lightning-layout-item size="2"></lightning-layout-item>
                <lightning-layout-item size="3">
                    Description
                </lightning-layout-item>
                <lightning-layout-item size="5">
                    <lightning-input type="text" name="Description__c" value={record.Description__c} required variant="label-hidden"  onchange={changeHandler}></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="2"></lightning-layout-item>
            </lightning-layout>
            
            <lightning-layout multiple-rows>
                <lightning-layout-item size="2"></lightning-layout-item>
                <lightning-layout-item size="3">
                    Transaction Type
                </lightning-layout-item>
                <lightning-layout-item size="5">
                    <lightning-combobox name="Transaction_Type__c" options={txnTypeOptions} variant="label-hidden" value={record.Transaction_Type__c}  onchange={changeHandler}></lightning-combobox>
                </lightning-layout-item>
                <lightning-layout-item size="2"></lightning-layout-item>
            </lightning-layout>
            
            <lightning-layout multiple-rows>
                <lightning-layout-item size="2"></lightning-layout-item>
                <lightning-layout-item size="3">
                    Category
                </lightning-layout-item>
                <lightning-layout-item size="5">
                    <lightning-combobox name="Category__c" options={categoryOptions} variant="label-hidden" value={record.Category__c}  onchange={changeHandler}></lightning-combobox>
                </lightning-layout-item>
                <lightning-layout-item size="2"></lightning-layout-item>
            </lightning-layout>
            
            <lightning-layout multiple-rows>
                <lightning-layout-item size="2"></lightning-layout-item>
                <lightning-layout-item size="3">
                    Payment Method
                </lightning-layout-item>
                <lightning-layout-item size="5">
                    <lightning-combobox name="Payment_Method__c" options={paymentMethodOptions} variant="label-hidden" value={record.Payment_Method__c}  onchange={changeHandler}></lightning-combobox>
                </lightning-layout-item>
                <lightning-layout-item size="2"></lightning-layout-item>
            </lightning-layout>
            
            <lightning-layout multiple-rows>
                <lightning-layout-item size="2"></lightning-layout-item>
                <lightning-layout-item size="3">
                    Payment Instrument
                </lightning-layout-item>
                <lightning-layout-item size="5">
                    <lightning-combobox name="Payment_Instrument__c" options={paymentInstrumentOptions} variant="label-hidden" value={record.Payment_Instrument__c}  onchange={changeHandler}></lightning-combobox>
                </lightning-layout-item>
                <lightning-layout-item size="2"></lightning-layout-item>
            </lightning-layout>
            
            <lightning-layout multiple-rows>
                <lightning-layout-item size="2"></lightning-layout-item>
                <lightning-layout-item size="3">
                    Payment Instrument Detail
                </lightning-layout-item>
                <lightning-layout-item size="5">
                    <lightning-combobox name="Payment_Instrument_Detail__c" options={paymentInstrumentDetailOptions} variant="label-hidden" value={record.Payment_Instrument_Detail__c}  onchange={changeHandler}></lightning-combobox>
                </lightning-layout-item>
                <lightning-layout-item size="2"></lightning-layout-item>
            </lightning-layout>
            

        </div>
    </lightning-card>

</template>
