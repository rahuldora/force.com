<template>

    <lightning-card variant="base">
        <div slot="title">
            Bank Accounts
        </div>
        <div slot="actions">
            <lightning-button variant="brand" label="Transfer Amount" onclick={handleTransfer}></lightning-button>
        </div>
        <!-- <div slot="footer">
        </div> -->
        <div>
            <!-- Card Body  -->
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Bank Account records are being fetched. Please wait for sometime!"></lightning-spinner>
            </template>
            <template if:false={isLoading}>
                <lightning-datatable key-field="id" data={data} columns={columns} onrowaction={handleRowAction}></lightning-datatable>
            </template>
            
        </div>
    </lightning-card>
    

</template>
